# The user-facing version (semver). Bump it to publish a new GitHub Release:
# patch for fixes, minor for features. CI creates release v<VERSION_NAME> when that tag doesn't exist yet,
# otherwise a prerelease v<VERSION_NAME>-build.<versionCode>.
# versionCode is NOT stored here: it is the commit count on main, so it always increases.
VERSION_NAME=2.71.0
