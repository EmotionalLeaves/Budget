name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main build: each one may publish a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (full history for versionCode)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Guard checks
        run: bash .github/scripts/guard.sh

      - name: Version info
        id: version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Sprout $VERSION_NAME ($VERSION_CODE)"

      - name: Unit tests and coverage
        run: ./gradlew --console=plain :core:test testDebugUnitTest :core:koverHtmlReport :core:koverXmlReport :app:koverHtmlReportDebug :app:koverXmlReportDebug

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob("*/build/reports/kover/*.xml")):
              r = ET.parse(f).getroot()
              c = next((x for x in r.findall("counter") if x.get("type") == "LINE"), None)
              if c is not None:
                  cov, miss = int(c.get("covered")), int(c.get("missed"))
                  line = f"{f}: {100 * cov / max(1, cov + miss):.1f}% lines covered"
                  print(line)
                  open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a").write(line + "\n")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            core/build/reports/kover/
            app/build/reports/kover/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Lint
        run: ./gradlew --console=plain lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      # Signed with the committed key (keystore/ci-release.keystore). Signing secrets are deliberately NOT mapped
      # here: switching keys would force an uninstall and wipe the user's data. See SECURITY.md.
      - name: Build release APK (R8)
        run: ./gradlew --console=plain assembleRelease
        env:
          # Optional read-only key so the app can fetch updates from this private repo. Missing = Releases page fallback.
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}

      - name: Check merged manifest (permissions and exported components)
        run: bash .github/scripts/manifest_check.sh

      - name: Verify signing certificate (must never change)
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          APK=app/build/outputs/apk/release/app-release.apk
          digest() { "$APKSIGNER" verify --print-certs "$1" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}'; }
          ACTUAL=$(digest "$APK")
          EXPECTED=$(tr -d '[:space:]' < keystore/ci-release.sha256)
          echo "APK cert: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate changed ($ACTUAL != $EXPECTED). Updates would fail to install."
            exit 1
          fi
          # Also compare with the APK of the most recent published release, if any.
          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            mkdir -p prev && gh release download "$PREV_TAG" --pattern '*.apk' --dir prev || true
            PREV_APK=$(ls prev/*.apk 2>/dev/null | head -1 || true)
            if [ -n "$PREV_APK" ]; then
              PREV=$(digest "$PREV_APK")
              echo "Previous release $PREV_TAG cert: $PREV"
              if [ "$PREV" != "$ACTUAL" ]; then
                echo "::error::Certificate differs from release $PREV_TAG."
                exit 1
              fi
            fi
          fi
          OUT="sprout-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
          cp "$APK" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      # Lets a crash report from the phone be decoded later ("retrace"). Contains class names only, no data.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          TAG="v$VERSION_NAME"
          # GitHub sometimes answers 503 for a moment; try again before giving up. If the release was
          # created but the APK upload failed, finish the upload instead of creating it twice.
          publish() {
            local tag="$1"; shift
            for i in 1 2 3 4 5; do
              if gh release view "$tag" > /dev/null 2>&1; then
                gh release upload "$tag" "$APK" --clobber && return 0
              elif gh release create "$tag" "$APK" "$@"; then
                return 0
              fi
              echo "Publishing failed (try $i), waiting..."; sleep $((i * 20))
            done
            return 1
          }
          if gh release view "$TAG" > /dev/null 2>&1; then
            # This version already has a release: publish a development build so every push has an APK.
            publish "$TAG-build.$VERSION_CODE" \
              --prerelease --target "$GITHUB_SHA" \
              --title "Sprout $VERSION_NAME (build $VERSION_CODE)" \
              --notes "Development build"
          else
            awk -v v="$VERSION_NAME" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then echo "Sprout $VERSION_NAME" > notes.md; fi
            printf '\n---\nInstall: tap the .apk file below. Updating? Install it over your current Sprout (never uninstall first).\n' >> notes.md
            publish "$TAG" \
              --latest --target "$GITHUB_SHA" \
              --title "Sprout $VERSION_NAME" \
              --notes-file notes.md
          fi
